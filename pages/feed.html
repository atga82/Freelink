<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed | FreeLink</title>
  <link rel="stylesheet" href="../librerias/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../librerias/bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body class="feed-page">
  <div id="navbar-container"></div>

  <main class="feed-container">
    <section class="feed-intro">
        <h1>Comunidad <span>FreeLink.</span></h1>
        <a href="crear_publicacion.html" class="create-post-btn">
        <i class="bi bi-plus-lg"></i> Crear publicación
        </a>
    </section>

    <section class="feed-filters" aria-label="Filtros de publicaciones">
      <div class="filter-title"><i class="bi bi-compass"></i><strong>Explorar publicaciones</strong></div>
      <div class="filters">
          <button class="filter-btn active" data-filter="all" type="button">Todo</button>
          <button class="filter-btn" data-filter="1" type="button">Diseño</button>
          <button class="filter-btn" data-filter="2" type="button">Programación</button>
          <button class="filter-btn" data-filter="3" type="button">Fotografía</button>
          <button class="filter-btn" data-filter="4" type="button">Video</button>
          <button class="filter-btn" data-filter="6" type="button">Artesanías</button>
          <button class="filter-btn" data-filter="7" type="button">Música</button>
          <button class="filter-btn" data-filter="8" type="button">Educación</button>
          <button class="filter-btn" data-filter="9" type="button">Creadores</button>
      </div>
    </section>

    <section class="feed-layout">
      <div class="posts-column" id="postsContainer" aria-live="polite"></div>
      <aside class="feed-sidebar">
        <section class="sidebar-card">
          <h2 class="sidebar-title">Personas que podrías conocer</h2>
          <div id="suggestionsContainer"></div>
        </section>
      </aside>
    </section>
  </main>

  <div id="footer-container"></div>
  <script src="../librerias/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/componentes.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', async () => {

      try {
          const respuesta = await fetch('../php/verificar_sesion.php', {
              method: 'GET',
              credentials: 'same-origin'
          });

          if (!respuesta.ok) {
              throw new Error('No fue posible verificar la sesión.');
          }

          const datos = await respuesta.json();

          if (!datos.authenticated) {
              window.location.replace('login.html');
              return;
          }

          const script = document.createElement('script');
          script.src = '../js/feed.js?v=12346'; 

          script.onload = () => {
              console.log("FEED.JS CARGADO CORRECTAMENTE DESDE:", script.src);
          };

          script.onerror = () => {
          console.error("NO SE PUDO CARGAR FEED.JS:", script.src);
          };

          document.body.appendChild(script);

      } catch (error) {
          console.error('Error al verificar la sesión:', error);
          window.location.replace('login.html');
      }

  });
</script>
</body>
</html>
